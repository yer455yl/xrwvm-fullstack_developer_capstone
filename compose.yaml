services:
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./server/database
    environment:
      MONGODB_URI: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy
  sentiment:
    build: ./server/djangoapp/microservices
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      backend_url: http://api:3030
      sentiment_analyzer_url: http://sentiment:5050
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      DEBUG: "False"
      SQLITE_PATH: /data/db.sqlite3
    volumes:
      - django-data:/data
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_cars && gunicorn djangoproj.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    depends_on:
      - api
      - sentiment
volumes:
  mongo-data:
  django-data:
